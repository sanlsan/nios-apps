name: android
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a test build, for example v0.1.0-test1"
        required: false
        default: "v0.0.0-dev"
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nios.jks"
            echo "NIOS_KEYSTORE=$RUNNER_TEMP/nios.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        env:
          NIOS_APPS_VERSION: ${{ inputs.version }}
          NIOS_APPS_VERSION_CODE: ${{ github.run_number }}
          NIOS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NIOS_KEY_ALIAS: nios
        run: gradle --no-daemon assembleRelease
      - name: Collect
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk NiosApps.apk
          sha256sum NiosApps.apk > NiosApps.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NiosApps-apk
          path: |
            NiosApps.apk
            NiosApps.apk.sha256
