name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, for example v0.1.1 (a dash like v0.2.0-rc1 makes a pre-release)"
        required: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
        env:
          NIOS_APPS_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Checksum
        shell: pwsh
        run: |
          Copy-Item target/release/NiosApps.exe NiosApps.exe
          $hash = (Get-FileHash NiosApps.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NiosApps.exe" | Out-File -Encoding ascii NiosApps.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            NiosApps.exe
            NiosApps.exe.sha256
